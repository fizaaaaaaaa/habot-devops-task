# Custom Gitleaks rules layered on top of the default ruleset.
# Purpose: catch the exact failure described in the hiring scenario — raw,
# hardcoded API credentials committed directly into application code.

title = "Habot Gitleaks Config"

[[rules]]
id = "habot-generic-api-key"
description = "Generic hardcoded API key/secret assigned in code"
regex = '''(?i)(api[_-]?key|secret[_-]?key|access[_-]?token)\s*=\s*['"][A-Za-z0-9_\-]{16,}['"]'''
tags = ["key", "API", "generic"]

[[rules]]
id = "habot-gcp-service-account-key"
description = "Embedded GCP service account private key"
regex = '''"private_key":\s*"-----BEGIN PRIVATE KEY-----'''
tags = ["key", "GCP"]

[allowlist]
description = "Ignore known-safe test fixtures"
paths = [
  '''(.*)fixtures/(.*)''',
]
